<!DOCTYPE html>

  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffe500" />

      name="description"

    />

      name="keywords"

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link
    rel="stylesheet"
    type="text/css"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
  />
  <link
    rel="stylesheet"
    type="text/css"
    href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>VijayCart - Smart Shopping. Better Choices.</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "VijayCart",
      "url": "https://vijaycart.com/",
      "description": "VijayCart - Smart Shopping. Better Choices.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://vijaycart.com/search/{search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "VijayCart",
      "url": "https://vijaycart.com/",
      "logo": "https://vijaycart.com/images/logo.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-82204-77466",
        "contactType": "customer service",
        "areaServed": "IN",
        "availableLanguage": ["en", "hi"]
      }
    }
    </script>
